<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <!-- css file -->
     <link rel="stylesheet" href="./style.css">

     <!-- font -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="container">
        <!-- title -->
         <h1>Expense Tracker</h1>

         <!-- 
         balance container 
         -->
          <div class="balance-container">
            <!-- balance titles -->
            <h2>Your Balance</h2>
            <h1 id="balance">$0.00</h1>

            <!-- total balance summery -->
            <div class="balance-history">
                <!-- total income  -->
                <div class="income">
                    <h3>Income</h3>
                    <p id="income-amount">$0.00</p>
                </div>

                <!-- total expenes -->
                <div class="expenses">
                    <h3>Expenses</h3>
                    <p id="expenses-amount">$0.00</p>
                </div>
            </div>
          </div>

          <!-- 
          Main Content
           -->
          <div class="main-content">
            <!-- transaction container -->
             <div class="transaction-container">
                <!-- title -->
                <h2>Transactions</h2>
                <!-- list -->
                <ul id="transaction-list">

                </ul>
             </div>

            <!-- form container -->
             <div class="transaction-container">
                <!-- form title -->
                <h2>Add Transaction</h2>
                
                <form id="transaction-form">
                    <!-- description content -->
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description-inputBox" placeholder="Enter Description..." required>
                    </div>
                    
                    <!-- amount content -->
                    <div class="form-group">
                        <label for="description">Amount</label>
                        <input type="number" id="amount-inputBox" placeholder="Enter Amount..." required>
                        <small>Use negative (-) for expenses</small>
                    </div>

                    <!-- form submit button -->
                     <button type="submit">Add Transaction</button>
                </form>
             </div>
          </div>
         
    </div>

    <!-- js file -->
     <script src="./script.js"></script>
</body>
</html>
